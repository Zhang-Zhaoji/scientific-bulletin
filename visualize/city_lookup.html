<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>城市与作者地址核验</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#172936;font:15px system-ui,"Microsoft YaHei",sans-serif}main{max-width:1250px;margin:auto;padding:28px 24px}h1{font-size:27px;margin:0 0 8px}p{color:#596e7c;line-height:1.65}section{background:white;border:1px solid #dce3e8;border-radius:12px;padding:20px;margin-top:18px}.controls{display:grid;grid-template-columns:145px 1fr 180px 130px 80px;gap:9px}input,select,button{font:inherit;padding:11px;border:1px solid #c5d1db;border-radius:7px;min-width:0}button{background:#153f55;color:white;cursor:pointer}.examples{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.examples button{padding:7px 11px;font-size:13px;background:#eef4f7;color:#254f66;border:0}#status{margin:12px 0;font-weight:600}#warnings{color:#924c08;background:#fff4df;padding:12px;border-radius:7px;display:none}#map{height:470px;width:100%}.grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr);gap:18px}.result{border-bottom:1px solid #e2e8ed;padding:12px 0;cursor:pointer}.result:last-child{border:0}.result strong{display:block;font-size:17px}.result small{display:block;margin-top:6px;color:#607786}.source{font-size:12px;color:#677f8d}a{color:#206785}#results{max-height:455px;overflow:auto}footer{margin-top:22px;font-size:12px;color:#68818f}@media(max-width:800px){main{padding:20px 14px}.controls{grid-template-columns:1fr 1fr}.controls input#query{grid-column:1/-1;grid-row:1}.grid{grid-template-columns:1fr}#map{height:330px}h1{font-size:23px}}
</style><script src="/vendor/echarts.min.js"></script><script src="/vendor/world.js"></script></head>
<body><main><h1>城市与作者地址核验</h1><p>搜索城市，或粘贴论文作者单位地址。结合国家、州省和邮编查看定位结果；同名城市会保留候选，地址冲突会提示复核。</p>
<section><form id="form" class="controls"><select id="mode" aria-label="搜索方式"><option value="address">识别单位地址</option><option value="city">搜索城市名称</option></select><input id="query" aria-label="城市或单位地址" placeholder="例如 Leipzig，或 GNOME Diagnostics, Powell, OH 43081"><select id="country" aria-label="国家"><option value="">不限国家</option></select><input id="region" aria-label="州省" placeholder="州省（可选）"><button>搜索</button></form>
<div class="examples"><button data-example="Institute for Applied Training Science, Leipzig 04109, Germany">Leipzig 地址</button><button data-example="GNOME Diagnostics, Powell, OH 43081">Powell 邮编冲突</button><button data-example="Unregistered Laboratory, Paris">Paris 同名城市</button></div><div id="status">正在加载城市库…</div><div id="warnings"></div></section>
<div class="grid"><section><div id="map"></div></section><section><h2 style="font-size:18px;margin-top:0">定位结果与候选</h2><div id="results">请输入城市或地址。</div><p class="source">城市坐标表示城市位置。它不能确认机构身份，也不等同于实验室的精确地址。</p></section></div>
<footer id="credit">地名数据：<a href="https://www.geonames.org/" target="_blank" rel="noopener">GeoNames</a> · CC BY 4.0。小型村镇可能缺失；邮编交叉核验目前覆盖美国与德国。数据保留原文，不自动修正冲突地址。</footer></main>
<script>
const map=echarts.init(document.getElementById('map'));map.setOption({tooltip:{formatter:p=>p.data.name+' · '+p.data.country+' / '+p.data.region},geo:{map:'world',roam:true,itemStyle:{areaColor:'#e6eef2',borderColor:'#fff'},emphasis:{itemStyle:{areaColor:'#c9dce6'}}},series:[{type:'scatter',coordinateSystem:'geo',symbolSize:12,itemStyle:{color:'#b4382e'},data:[]}]});window.addEventListener('resize',()=>map.resize());
const $=id=>document.getElementById(id);let cities=[];
const labels={matched:'已匹配地址中的城市',matched_with_conflict:'已定位城市，地址存在冲突',ambiguous:'城市存在歧义，请补充国家或州省',unresolved:'没有足够证据定位城市',candidates:'城市候选'};
function warn(w){if(w.type==='city_postal_conflict')return `${w.city} 与邮编 ${w.postal_code} 不一致：邮编库对应 ${w.postal_places.join('、')}${w.postal_regions?.length?'（'+w.postal_regions.join('、')+'）':''}。请核对原文或机构官网。`;if(w.type==='invalid_postal_format')return `邮编 ${w.value} 格式异常，请核对原文。`;return `邮编 ${w.value} 未在当前邮编库中找到。`;}
async function search(){const q=$('query').value.trim();if(!q)return;$('status').textContent='正在查询…';const params=new URLSearchParams({q,mode:$('mode').value,country:$('country').value,region:$('region').value});const result=await (await fetch('/api/search?'+params)).json();$('status').textContent=labels[result.status]||result.error||result.status;cities=result.cities||[];for(const a of result.ambiguous||[])cities.push(...a.candidates);cities=[...new Map(cities.map(c=>[c.id,c])).values()];if(result.candidate_count)$('status').textContent+=` · ${result.candidate_count} 个候选（最多展示 25 个）`;
const warnings=result.warnings||[];$('warnings').style.display=warnings.length?'block':'none';$('warnings').textContent=warnings.map(warn).join(' ');$('results').replaceChildren();
for(const c of cities){const div=document.createElement('div');div.className='result';const name=document.createElement('strong');name.textContent=c.name;const detail=document.createElement('span');detail.textContent=c.region+' · '+c.country;const geo=document.createElement('small');geo.textContent=`纬度 ${c.latitude}，经度 ${c.longitude}`;const link=document.createElement('a');link.textContent='查看地名来源';link.href=c.source_url;link.target='_blank';link.rel='noopener';div.append(name,detail,geo,link);div.onclick=()=>map.setOption({geo:{center:[c.longitude,c.latitude],zoom:5}});$('results').append(div);}
if(!cities.length)$('results').textContent='未找到唯一城市；请补充地址信息。';map.setOption({geo:{center:[0,15],zoom:1},series:[{data:cities.map(c=>({name:c.name,country:c.country,region:c.region,value:[c.longitude,c.latitude]}))}]});
if(cities.length===1)map.setOption({geo:{center:[cities[0].longitude,cities[0].latitude],zoom:3}});}
$('form').onsubmit=e=>{e.preventDefault();search().catch(e=>$('status').textContent='查询失败：'+e.message);};document.querySelectorAll('[data-example]').forEach(b=>b.onclick=()=>{$('mode').value='address';$('country').value='';$('region').value='';$('query').value=b.dataset.example;search();});
fetch('/api/metadata').then(r=>r.json()).then(m=>{for(const [code,name] of Object.entries(m.countries).sort((a,b)=>a[1].localeCompare(b[1]))){const o=document.createElement('option');o.value=code;o.textContent=name;$('country').append(o);}$('status').textContent=`城市库已就绪 · ${m.counts.cities.toLocaleString()} 个城市与居民点 · ${m.counts.city_aliases.toLocaleString()} 条名称索引`;});
</script></body></html>
