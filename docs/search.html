<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>搜索论文 | Neuroscience Bulletin</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header>
    <div class="wrap site-head">
      <a class="brand" href="index.html">Neuroscience Bulletin</a>
      <nav class="nav">
        <a href="search.html">搜索</a>
        <a href="https://github.com/Zhang-Zhaoji/scientific-bulletin/issues">Reports</a>
        <a href="https://github.com/Zhang-Zhaoji/scientific-bulletin/">GitHub</a>
      </nav>
    </div>
  </header>

  <button class="favorite-tray-button" type="button" data-favorite-open aria-label="打开收藏夹">
    <img src="assets/icons/folder.svg" alt="">
    <span data-favorite-count>0</span>
  </button>
  <aside class="favorite-drawer" data-favorite-drawer hidden aria-label="收藏夹">
    <div class="favorite-drawer-head">
      <div>
        <strong>收藏夹</strong>
        <span data-favorite-summary>暂无收藏</span>
      </div>
      <button class="favorite-close" type="button" data-favorite-close aria-label="关闭收藏夹">×</button>
    </div>
    <div class="favorite-list" data-favorite-list></div>
    <div class="favorite-actions">
      <button type="button" data-favorite-copy>复制 Markdown</button>
      <button type="button" data-favorite-download>下载 .md</button>
      <button type="button" data-favorite-clear>清空</button>
    </div>
  </aside>
  <main class="wrap">
    <article class="paper">

<h1>搜索论文</h1>
<div class="search-box">
  <input id="search-input" type="search" placeholder="输入关键词，如：星形胶质细胞 / microglia / 睡眠" autocomplete="off" autofocus>
  <p id="search-status" class="meta">正在加载索引…</p>
  <p id="search-count" class="search-count"></p>
</div>
<section id="search-results" class="search-results"></section>

    </article>
  </main>
  <script>
    (function () {
      var STORAGE_KEY = "scientific-bulletin:favorites";
      var drawer = document.querySelector("[data-favorite-drawer]");
      var list = document.querySelector("[data-favorite-list]");
      var countNodes = Array.prototype.slice.call(document.querySelectorAll("[data-favorite-count]"));
      var summary = document.querySelector("[data-favorite-summary]");
      if (!drawer || !list) return;

      function loadFavorites() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        } catch (error) {
          return [];
        }
      }

      function saveFavorites(items) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      }

      function favoriteFromCard(card) {
        return {
          id: card.dataset.favoriteId,
          title: card.dataset.favoriteTitle || "Untitled",
          url: card.dataset.favoriteUrl || location.href,
          pageTitle: document.title.replace(/\s+\|\s+Neuroscience Bulletin$/, ""),
          pageUrl: location.href.split("#")[0],
          markdown: card.dataset.favoriteMarkdown || card.innerText.trim()
        };
      }

      function toMarkdown(items) {
        if (!items.length) return "# 神经科学快讯收藏\n\n暂无收藏。\n";
        var lines = ["# 神经科学快讯收藏", ""];
        items.forEach(function (item, index) {
          lines.push("## " + (index + 1) + ". " + item.title);
          lines.push("");
          if (item.url) lines.push("- 链接: " + item.url);
          if (item.pageTitle) lines.push("- 来源报告: [" + item.pageTitle + "](" + item.pageUrl + ")");
          lines.push("");
          lines.push(item.markdown || item.title);
          lines.push("");
          lines.push("---");
          lines.push("");
        });
        return lines.join("\n");
      }

      function downloadText(filename, text) {
        var blob = new Blob([text], { type: "text/markdown;charset=utf-8" });
        var url = URL.createObjectURL(blob);
        var link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }

      function updateButtons(items) {
        var ids = new Set(items.map(function (item) { return item.id; }));
        document.querySelectorAll("[data-favorite-toggle]").forEach(function (button) {
          var card = button.closest(".article-card");
          var active = card && ids.has(card.dataset.favoriteId);
          button.classList.toggle("active", Boolean(active));
          button.setAttribute("aria-pressed", active ? "true" : "false");
          button.querySelector("span").textContent = active ? "已收藏" : "收藏";
        });
      }

      function renderFavorites() {
        var items = loadFavorites();
        countNodes.forEach(function (node) { node.textContent = String(items.length); });
        if (summary) summary.textContent = items.length ? items.length + " 篇文章" : "暂无收藏";
        if (!items.length) {
          list.innerHTML = '<p class="favorite-empty">还没有收藏文章。</p>';
        } else {
          list.innerHTML = items.map(function (item) {
            return '<article class="favorite-item">'
              + '<a href="' + escapeHtml(item.url || item.pageUrl || "#") + '">' + escapeHtml(item.title) + '</a>'
              + '<button type="button" data-favorite-remove="' + escapeHtml(item.id) + '">移除</button>'
              + '</article>';
          }).join("");
        }
        updateButtons(items);
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, function (char) {
          return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char];
        });
      }

      document.addEventListener("click", function (event) {
        var open = event.target.closest("[data-favorite-open]");
        if (open) {
          drawer.hidden = false;
          renderFavorites();
          return;
        }

        if (event.target.closest("[data-favorite-close]")) {
          drawer.hidden = true;
          return;
        }

        var toggle = event.target.closest("[data-favorite-toggle]");
        if (toggle) {
          var card = toggle.closest(".article-card");
          if (!card) return;
          var items = loadFavorites();
          var existingIndex = items.findIndex(function (item) { return item.id === card.dataset.favoriteId; });
          if (existingIndex >= 0) {
            items.splice(existingIndex, 1);
          } else {
            items.push(favoriteFromCard(card));
          }
          saveFavorites(items);
          renderFavorites();
          return;
        }

        var remove = event.target.closest("[data-favorite-remove]");
        if (remove) {
          saveFavorites(loadFavorites().filter(function (item) { return item.id !== remove.dataset.favoriteRemove; }));
          renderFavorites();
          return;
        }

        if (event.target.closest("[data-favorite-copy]")) {
          navigator.clipboard.writeText(toMarkdown(loadFavorites()));
          return;
        }

        if (event.target.closest("[data-favorite-download]")) {
          downloadText("favorites.md", toMarkdown(loadFavorites()));
          return;
        }

        if (event.target.closest("[data-favorite-clear]")) {
          saveFavorites([]);
          renderFavorites();
        }
      });

      renderFavorites();
    })();
  </script>
  <script src="assets/vendor/minisearch.min.js"></script>
  <script src="search-index.js"></script>
  <script>
    (function () {
      var input = document.getElementById("search-input");
      var resultsEl = document.getElementById("search-results");
      var statusEl = document.getElementById("search-status");
      var countEl = document.getElementById("search-count");
      var docs = window.__SEARCH_INDEX__ || [];
      var mini = null;

      function escapeHtml(value) {
        return String(value == null ? "" : value).replace(/[&<>"']/g, function (char) {
          return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char];
        });
      }

      function highlight(text, query) {
        var safe = escapeHtml(text);
        if (!query) return safe;
        var q = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        var re = new RegExp("(" + q + ")", "gi");
        return safe.replace(re, '<mark>$1</mark>');
      }

      function snippet(abstract, query, len) {
        if (!abstract) return "";
        var text = abstract;
        var q = (query || "").toLowerCase();
        var pos = text.toLowerCase().indexOf(q);
        if (pos < 0) {
          return text.length > len ? text.slice(0, len) + "…" : text;
        }
        var start = Math.max(0, pos - Math.floor((len - q.length) / 2));
        var end = Math.min(text.length, start + len);
        var prefix = start > 0 ? "…" : "";
        var suffix = end < text.length ? "…" : "";
        return prefix + text.slice(start, end) + suffix;
      }

      function tierClass(tier) {
        if (!tier) return "tier-default";
        if (tier.indexOf("重点") >= 0 || tier.indexOf("必读") >= 0) return "tier-top";
        if (tier.indexOf("推荐") >= 0) return "tier-rec";
        return "tier-default";
      }

      function resultLink(doc) {
        if (doc.report_file) {
          return doc.report_file + (doc.anchor ? "#" + doc.anchor : "");
        }
        return doc.url || "#";
      }

      function renderResult(doc, query) {
        var title = doc.title_zh || doc.title || "(无标题)";
        var sub = doc.title && doc.title !== title ? doc.title : "";
        var meta = [];
        if (doc.journal) meta.push(escapeHtml(doc.journal));
        if (doc.date) meta.push(escapeHtml(doc.date));
        if (doc.primary_category) meta.push(escapeHtml(doc.primary_category));
        var tierHtml = doc.recommendation_tier
          ? '<span class="search-tier ' + tierClass(doc.recommendation_tier) + '">' + escapeHtml(doc.recommendation_tier) + '</span>'
          : "";
        var scoreHtml = doc.total_score != null
          ? '<span class="search-score">评分 ' + Number(doc.total_score).toFixed(1) + '</span>'
          : "";
        var snip = snippet(doc.abstract, query, 160);
        var subHtml = sub ? '<div class="search-sub">' + highlight(sub, query) + '</div>' : "";

        var favId = doc.id || "";
        var favTitle = doc.title_zh || doc.title || "";
        var favUrl = resultLink(doc);
        var favMarkdown = "**" + favTitle + "**";
        if (doc.journal) favMarkdown += "\n- 期刊: " + doc.journal;
        if (doc.date) favMarkdown += "\n- 日期: " + doc.date;
        if (doc.total_score != null) favMarkdown += "\n- 评分: " + Number(doc.total_score).toFixed(1);
        if (doc.recommendation_tier) favMarkdown += "\n- 推荐等级: " + doc.recommendation_tier;
        if (doc.url) favMarkdown += "\n- 原文链接: " + doc.url;

        var favBtn = '<button class="favorite-toggle" type="button" data-favorite-toggle aria-pressed="false">'
          + '<img src="assets/icons/folder.svg" alt="">'
          + '<span>收藏</span></button>';

        return '<article class="search-result article-card"'
          + ' data-favorite-id="' + escapeHtml(favId) + '"'
          + ' data-favorite-title="' + escapeHtml(favTitle) + '"'
          + ' data-favorite-url="' + escapeHtml(favUrl) + '"'
          + ' data-favorite-markdown="' + escapeHtml(favMarkdown) + '"'
          + '>'
          + '<div class="search-result-head">'
          + '<h3><a href="' + escapeHtml(favUrl) + '">' + highlight(title, query) + '</a></h3>'
          + '<span class="article-card-actions">' + tierHtml + scoreHtml + favBtn + '</span>'
          + '</div>'
          + subHtml
          + '<div class="search-meta">' + meta.join(' · ') + '</div>'
          + '<p class="search-snippet">' + highlight(snip, query) + '</p>'
          + '</article>';
      }

      function runSearch(query) {
        query = (query || "").trim();
        if (!query) {
          resultsEl.innerHTML = "";
          countEl.textContent = "";
          statusEl.textContent = "输入关键词搜索论文（支持中英文标题、摘要、期刊、分类）";
          return;
        }

        var matches = [];
        if (mini && typeof MiniSearch !== "undefined") {
          matches = mini.search(query);
        } else {
          // Fallback: substring match when MiniSearch is unavailable.
          var lower = query.toLowerCase();
          matches = docs.filter(function (doc) {
            return [doc.title, doc.title_zh, doc.abstract, doc.journal, doc.primary_category, doc.domain]
              .some(function (field) { return field && field.toLowerCase().indexOf(lower) >= 0; });
          });
        }

        countEl.textContent = "共 " + matches.length + " 条结果";
        if (!matches.length) {
          resultsEl.innerHTML = '<p class="search-empty">未找到匹配的论文。</p>';
          return;
        }
        resultsEl.innerHTML = matches.map(function (m) {
          return renderResult(m, query);
        }).join("");
      }

      function initMini() {
        if (typeof MiniSearch === "undefined") return;
        mini = new MiniSearch({
          fields: ['title', 'title_zh', 'abstract', 'journal', 'primary_category', 'domain'],
          storeFields: ['title', 'title_zh', 'abstract', 'journal', 'date', 'url', 'report_file', 'recommendation_tier', 'total_score', 'primary_category', 'domain', 'anchor'],
          searchOptions: {
            boost: { title: 2, title_zh: 2 },
            fuzzy: 0.2,
            prefix: true
          }
        });
        mini.addAll(docs);
      }

      // 索引通过 <script src="search-index.js"> 同步加载，无需 fetch
      if (docs.length > 0) {
        initMini();
        statusEl.textContent = "索引已就绪，共 " + docs.length + " 篇论文。输入关键词开始搜索。";
        var initial = input.value.trim();
        if (initial) runSearch(initial);
      } else {
        statusEl.textContent = "索引加载失败，请刷新重试。";
      }

      var debounceTimer = null;
      input.addEventListener("input", function () {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(function () { runSearch(input.value); }, 180);
      });

      input.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          clearTimeout(debounceTimer);
          runSearch(input.value);
        }
      });

      if (window.location.hash) {
        var hashQuery = decodeURIComponent(window.location.hash.slice(1));
        if (hashQuery) input.value = hashQuery;
      }
    })();
  </script>
</body>
</html>
